name: publish-map
on:
  push: {branches: [main]}
  schedule: [{cron: "30 */6 * * *"}]   # GFS runs every 6h; the script falls back to an older cycle if the newest isn't out yet
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pygrib numpy cryptography
      - run: mkdir -p data && python gfs_to_json.py   # data stays out of git history; it only lives in the deployed site
        env:
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}   # optional: encrypts the forecast for the Teacher view
      - run: mkdir site && cp -r index.html css js data site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
